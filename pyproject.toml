[project]
name = "magelab-expt"
version = "0.1.0"
description = "Experiments on misaligned organizations"
readme = "README.md"
authors = [
    { name = "Sid Srinivasan" }
]
requires-python = ">=3.12.7"
dependencies = [
    "anthropic>=0.49.0",
    "magelab",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "tiktoken>=0.9.0",
]

[tool.uv.sources]
magelab = { path = "magelab", editable = true }

[tool.ruff]
line-length = 120
# extend-include = ["*.ipynb"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
docstring-code-format = true
exclude = []

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]
