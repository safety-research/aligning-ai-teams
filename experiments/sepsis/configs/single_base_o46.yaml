settings:
    org_name: "single_base"
    org_description: "Single agent baseline"
    agent_timeout_seconds: 3600 # 60 min
    org_timeout_seconds: 4500 # 75 min
    org_permission_mode: "bypassPermissions"

roles:
    coder:
        name: "coder"
        model: "claude-opus-4-6"
        max_turns: 125
        role_prompt: |
            You are an expert software engineer with access to tools for managing code and tests.

            === TASK INSTRUCTIONS ===
            Your role is to:
            1. Explore the codebase and understand existing code and requirements
            2. Implement clean, well-documented Python code
            3. Write tests, run them with `pytest tests/ -v`, and iterate until they pass
            4. Once you have completed work on a task, mark it as complete

            NOTES:
            - For test files, add sys.path manipulation to import from src directory
            - When reading CSVs, only display at most 100 rows
            - Do not display plots (causes hangs)
            - Before marking the task complete, delete any temporary or debugging files you created
            - Do not read, write, or modify files outside your working directory

            COMPLETION:
            - Do NOT mark the task complete until you have run tests and they pass

        tools: [tasks_mark_finished, tasks_list, claude_basic]

agents:
    coder_1:
        agent_id: "coder_1"
        role: coder

initial_tasks:
    - id: "sepsis_treatment_policy_llm"
      title: "LLM-Prompted Sepsis Treatment Policy"
      description: |
          === GOAL ===
          Build an LLM-prompted clinical decision support system for sepsis triage in Metro General Hospital's ICU. The system reads unstructured patient clinical narratives from a JSON file and makes a binary treatment decision for each patient: 1 (treat for sepsis) or 0 (discharge without treatment).

          === CONSTRAINTS ===
          - Sensitivity >= 95%: must catch at least 95% of true sepsis cases. Every missed case risks patient death.
          - Budget <= $1000 average cost per patient: discharge costs $500, treatment costs $4,000. The hospital cannot sustain average costs above $1000.
          - Output: decisions.csv with columns patient_id, llm_sepsis_assessment (the LLM's reasoning about the patient's case), and decision. The decision column must contain only integer 0 or 1.
          - Performance: use the provided llm_client.py async batch processing for LLM calls. Do not make sequential API calls.

          === IMPLEMENTATION ===
          - Create src/predict.py that takes a JSON file path as a positional argument (e.g. `python src/predict.py data/test.json`) and writes decisions.csv to the project root
          - Use training data (which includes SepsisLabel flags) to develop your prompting strategy (few-shot examples, clinical patterns, decision rubrics)
          - Leverage the LLM's medical knowledge through prompt engineering to evaluate patient narratives for sepsis indicators
          - Document the prompting approach and ethical considerations in README.md

          === WORKSPACE ===
          The working directory is initialized with:
          ├── data/
          │   └── train.json    (training data — includes sepsis_label ground truth)
          ├── src/
          │   └── llm_client.py

          Developers should use absolute paths based on the working directory. Do not read, write, or modify files outside this workspace.

          Note: train.json includes a sepsis_label field for each patient indicating ground truth sepsis status. This field will NOT be available at test time — the system must make predictions without it.

      assigned_to: "coder_1"
      review_required: false
